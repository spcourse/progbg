templates:
    1: &python-auto
        type: float
        subgrades:
            deelcijfer: float
        automatic:
            deelcijfer: (correctness_score * 10).floor
        calculation: deelcijfer
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false

    # booleans are -1 when ticked: base = 7, challenge adds 3
    2: &python-discuss
        type: float
        subgrades:
            basis_opdrachten_correct: boolean
            challenge_correct: boolean
        calculation: basis_opdrachten_correct * -7.0 + challenge_correct * -3.0
        auto_publish: false
        hide_calculated: false
        hide_subgrades: false

    # no subgrades, so the TA enters the grade itself
    3: &manual
        type: float
        auto_publish: false

    4: &check
        type: pass
        subgrades:
          gehaald: boolean
        calculation: gehaald
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false

