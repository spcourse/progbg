templates:
    1: &automatic-publish
        type: float
        subgrades:
            deelcijfer: float
        automatic:
            deelcijfer: (correctness_score * 10).floor
        calculation: "deelcijfer < 10 && 0 || 10"
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false
    
    2: &automatic-check
        type: float
        subgrades:
            deelcijfer: float
            besproken: boolean
        automatic:
            deelcijfer: (correctness_score * 10).floor
        calculation: besproken == -1 && deelcijfer || 0
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    3: &manual-check
        type: float
        subgrades:
            deelcijfer: float
            besproken: boolean
        automatic:
            deelcijfer: "10"
        calculation: besproken == -1 && deelcijfer || 0
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

